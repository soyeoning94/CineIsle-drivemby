name: Build APK

# 手动触发，或 push 到 main/drivemby 分支时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main, drivemby ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            cat > keystore.properties <<EOF
          storeFile=$PWD/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
            echo "已配置 release 签名"
          else
            echo "未配置密钥库，仅构建 debug 包（用 Android 默认 debug 签名，可直接安装）"
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          if [ -f keystore.properties ]; then
            ./gradlew assembleFdroidRelease --no-daemon --stacktrace
          else
            ./gradlew assembleFdroidDebug --no-daemon --stacktrace
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: cineisle-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
