name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, drivemby ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 自己装 SDK：官方 setup-android 在部分 runner 上会失败，这里用和本机验证过的一致路径
      - name: Install Android SDK
        run: |
          set -eux
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          ls "$SDK/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
            printf 'storeFile=%s/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD" "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_ALIAS }}" "${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
            echo "已配置 release 签名"
          else
            echo "未配置密钥库 → 只构建 debug 包（Android 默认 debug 签名，可直接安装）"
          fi

      - name: Build APK
        run: |
          set -eux
          chmod +x ./gradlew
          if [ -f keystore.properties ]; then
            ./gradlew assembleFdroidRelease --no-daemon --stacktrace
          else
            ./gradlew assembleFdroidDebug --no-daemon --stacktrace
          fi

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cineisle-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: warn
